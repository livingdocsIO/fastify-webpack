# Mirrors the eslint step of .drone.yml, and checks the commit messages of a
# pull request with relcut, the tool the Release workflow releases with.
name: Lint

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: lint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    if: github.event_name == 'push'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: livingdocsIO/actions/checkout@0bc5eab38b93cf312e0c0fb4b11227a29ddadc35
      # Same image and default command as the Drone eslint step.
      - run: docker run --rm -v "$PWD:/drone/src" -w /drone/src marcbachmann/eslint:4.19.1

  commits:
    name: Commit Messages
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: livingdocsIO/actions/checkout@0bc5eab38b93cf312e0c0fb4b11227a29ddadc35
      - uses: livingdocsIO/actions/relcut@0bc5eab38b93cf312e0c0fb4b11227a29ddadc35
        with:
          branches: master
          command: check
          check-run-id: ${{ job.check_run_id }}
