# Publishes @livingdocs/fastify-webpack to npm with npm trusted publishing
# (OIDC, `id-token: write`), so no npm publish token is stored anywhere.
# Same setup as the Release workflows of livingdocs-editor and -framework.
#
# Needs, before it can publish:
# - npmjs.com, package settings of @livingdocs/fastify-webpack, Trusted
#   publishing: GitHub Actions, organization livingdocsIO, repository
#   fastify-webpack, workflow release.yml.
# - Repository variable GHA_RELEASE_ENABLED=true. Until it is set, the job is
#   skipped, so this workflow and the Drone release step never both publish.
#   Remove the release step from .drone.yml when setting it.
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    if: vars.GHA_RELEASE_ENABLED == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    concurrency:
      group: release
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: livingdocsIO/actions/wait-for-workflow@0bc5eab38b93cf312e0c0fb4b11227a29ddadc35
        timeout-minutes: 25
        with:
          workflow: lint.yml
          job: ESLint

      - uses: livingdocsIO/actions/checkout@0bc5eab38b93cf312e0c0fb4b11227a29ddadc35

      - uses: livingdocsIO/actions/setup-node@0bc5eab38b93cf312e0c0fb4b11227a29ddadc35
        with:
          node-version: 26

      # Reads release.extends from package.json; prepare runs npm ci
      # --ignore-scripts and npm pack itself.
      - uses: livingdocsIO/actions/relcut@0bc5eab38b93cf312e0c0fb4b11227a29ddadc35
        with:
          branches: master
          publish: npm
