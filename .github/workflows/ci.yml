# Lint and release @livingdocs/fastify-webpack.
#
# This repository is public, so it cannot use the private livingdocsIO/actions
# (GitHub refuses actions from a private repository in a public one). The jobs
# use the public actions they wrap instead: actions/checkout, actions/setup-node
# and marcbachmann/relcut, pinned to commit SHAs.
#
# The release publishes to npm with relcut and npm trusted publishing (OIDC,
# `id-token: write`), so no npm publish token is stored anywhere. It needs
# npmjs.com, package settings of @livingdocs/fastify-webpack, Trusted
# publishing: GitHub Actions, organization livingdocsIO, repository
# fastify-webpack, workflow ci.yml.
name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    if: github.event_name == 'push'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same image and default command as the Drone eslint step.
      - run: docker run --rm -v "$PWD:/drone/src" -w /drone/src marcbachmann/eslint:4.19.1

  commits:
    name: Commit Messages
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false
      - uses: marcbachmann/relcut@06d0d788b80f8e4909aeec14edf0cd8b951cd5c4 # v1.0.2
        with:
          command: check
          branches: master
          check-run-id: ${{ job.check_run_id }}

  release:
    name: Release
    needs: eslint
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted
    timeout-minutes: 30
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write       # the tag and the GitHub release
      issues: write
      pull-requests: write  # comments on the released pull requests
      id-token: write       # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # relcut reads every tag and commit
          filter: tree:0
          persist-credentials: false # relcut refuses tokens left in .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: marcbachmann/relcut@06d0d788b80f8e4909aeec14edf0cd8b951cd5c4 # v1.0.2
        with:
          branches: master
          publish: npm
